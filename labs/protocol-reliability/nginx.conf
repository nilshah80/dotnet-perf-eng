events {}

http {
  upstream api_http {
    zone api_http 64k;
    ip_hash;
    server api-a:8080 max_fails=1 fail_timeout=2s;
    server api-b:8080 max_fails=1 fail_timeout=2s;
  }

  upstream api_grpc {
    zone api_grpc 64k;
    server api-a:8081 max_fails=1 fail_timeout=2s;
    server api-b:8081 max_fails=1 fail_timeout=2s;
  }

  server {
    listen 8080;
    location / {
      proxy_pass http://api_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }

  server {
    listen 8081 http2;
    location / {
      grpc_pass grpc://api_grpc;
      grpc_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
