# The gateway is lab infrastructure, not the system under test: it must never be
# the limit. With nginx's defaults (one worker, 512 worker_connections) and a new
# upstream connection per request, P05 at 384 VUs dropped 221,657 connections
# ("512 worker_connections are not enough") and exhausted the gateway container's
# own ports toward the API ("Address not available").
worker_processes auto;
worker_rlimit_nofile 32768;

events {
  worker_connections 8192;
}

http {
  # Only a WebSocket handshake asks the upstream to upgrade; every other request
  # sends an empty Connection header so the upstream connection is kept alive.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # Requests are balanced across both replicas. ip_hash pinned every request
  # from the generator host to whichever replica its address hashed to, so one
  # replica served all traffic and a diagnosis of the other captured an idle
  # process. SignalR needs no stickiness: the workload skips negotiation.
  upstream api_http {
    zone api_http 64k;
    server api-a:8080 max_fails=1 fail_timeout=2s;
    server api-b:8080 max_fails=1 fail_timeout=2s;
    keepalive 64;
  }

  # The measurement-window attestation names the replica it asks
  # (X-Perf-Replica), so each replica's process generation is checked at both
  # boundaries instead of whichever replica one balanced probe reached.
  upstream replica_api_a {
    server api-a:8080;
  }
  upstream replica_api_b {
    server api-b:8080;
  }
  map $http_x_perf_replica $window_replica {
    api-a replica_api_a;
    api-b replica_api_b;
    default "";
  }

  upstream api_grpc {
    zone api_grpc 64k;
    server api-a:8081 max_fails=1 fail_timeout=2s;
    server api-b:8081 max_fails=1 fail_timeout=2s;
    keepalive 64;
  }

  server {
    listen 8080;
    location = /api/reliability/window {
      if ($window_replica = "") {
        return 400;
      }
      proxy_pass http://$window_replica;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }
    location / {
      proxy_pass http://api_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }

  server {
    listen 8081;
    http2 on;
    location / {
      grpc_pass grpc://api_grpc;
      grpc_next_upstream error timeout http_502 http_503 http_504;
    }
  }

  # A separate HTTP listener makes the multi-origin journey's second target a
  # real origin rather than a path alias. It has the same upstream on purpose:
  # the fixture tests closed routing authorization, not different application
  # behavior behind a second host.
  server {
    listen 8082;
    location / {
      proxy_pass http://api_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
