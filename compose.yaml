name: perflab

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: perflab
      POSTGRES_USER: perflab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perflab}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=250
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perflab -d perflab"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --latency-monitor-threshold
      - "50"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 384m

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: perflab
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-perflab}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m

  lgtm:
    image: grafana/otel-lgtm:0.31.0
    container_name: perflab-lgtm
    environment:
      TEMPO_EXTRA_ARGS: --query-frontend.mcp-server.enabled=true
      # One 27-scenario sweep wrote 812 MB of traces and 364 MB of logs against a
      # 3 GiB limit, which starved evidence capture of traces and metrics for the
      # last seven scenarios. Prometheus is not the problem (1.5 MB, ~5k series),
      # so the trace volume is capped at the source with sampling below; this is
      # belt-and-braces so a long session cannot grow the metric store unbounded.
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=6h --storage.tsdb.retention.size=512MB
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/perflab.json
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:4040:4040"
    volumes:
      - lgtm-data:/data
      - ./infra/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./infra/grafana/perflab.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/perflab.json:ro
    # A full 27-scenario sweep saturated this at 2g: Prometheus and Tempo stopped
    # responding partway through, which starved evidence capture of traces and
    # logs for the later scenarios. Raised to 3g, which keeps the sum of all
    # container limits inside the Docker VM's 8 GiB budget.
    mem_limit: 4g

  dotnet-monitor:
    image: mcr.microsoft.com/dotnet/monitor:10.0
    command:
      - collect
      - --no-auth
    environment:
      DOTNETMONITOR_DiagnosticPort__ConnectionMode: Listen
      DOTNETMONITOR_DiagnosticPort__EndpointName: /diag/dotnet-monitor.sock
      DOTNETMONITOR_Storage__DefaultSharedPath: /diag
      DOTNETMONITOR_InProcessFeatures__Enabled: "true"
      DOTNETMONITOR_Urls: http://+:52323
      DOTNETMONITOR_Metrics__Endpoints: http://+:52325
    ports:
      - "127.0.0.1:52323:52323"
      - "127.0.0.1:52325:52325"
    volumes:
      - diagnostic-ipc:/diag
    mem_limit: 512m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/PerfLab.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=perflab;Username=perflab;Password=${POSTGRES_PASSWORD:-perflab};Maximum Pool Size=20;Minimum Pool Size=0;Timeout=5;Command Timeout=5;GSS Encryption Mode=Disable;Application Name=perflab-api
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=5000,syncTimeout=3000
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: perflab
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-perflab}
      PERF_SCENARIO: ${PERF_SCENARIO:-S00}
      PERF_RUN_ID: ${PERF_RUN_ID:-local-manual}
      PERF_RUN_MODE: ${PERF_RUN_MODE:-measure}
      SEED_SCALE: ${SEED_SCALE:-smoke}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: 5000
      # Head sampling keeps whole traces intact while capping what reaches Tempo.
      # Evidence capture only reads the ten slowest traces per scenario, so a
      # fraction is ample for structural findings such as span counts per request.
      # Raise to 1.0 for a single-scenario run when the extreme tail is the
      # subject, since a sample can miss the true worst outlier.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${PERFLAB_TRACE_SAMPLE_RATIO:-0.25}
      DOTNET_DiagnosticPorts: /diag/dotnet-monitor.sock,nosuspend
      DOTNET_gcServer: "1"
      DOTNET_GCHeapHardLimitPercent: "50"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - diagnostic-ipc:/diag
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_started
      dotnet-monitor:
        condition: service_started
    cpus: 1.0
    mem_limit: 768m
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/PerfLab.Worker/Dockerfile
    environment:
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=perflab;Username=perflab;Password=${POSTGRES_PASSWORD:-perflab};Maximum Pool Size=20;Minimum Pool Size=0;Timeout=5;Command Timeout=5;GSS Encryption Mode=Disable;Application Name=perflab-worker
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: perflab
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-perflab}
      PERF_SCENARIO: ${PERF_SCENARIO:-S00}
      PERF_RUN_ID: ${PERF_RUN_ID:-local-manual}
      PERF_RUN_MODE: ${PERF_RUN_MODE:-measure}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: 5000
      # Head sampling keeps whole traces intact while capping what reaches Tempo.
      # Evidence capture only reads the ten slowest traces per scenario, so a
      # fraction is ample for structural findings such as span counts per request.
      # Raise to 1.0 for a single-scenario run when the extreme tail is the
      # subject, since a sample can miss the true worst outlier.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${PERFLAB_TRACE_SAMPLE_RATIO:-0.25}
      DOTNET_DiagnosticPorts: /diag/dotnet-monitor.sock,nosuspend
      DOTNET_gcServer: "1"
      DOTNET_GCHeapHardLimitPercent: "60"
    volumes:
      - diagnostic-ipc:/diag
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_started
      dotnet-monitor:
        condition: service_started
    cpus: 0.75
    mem_limit: 512m
    restart: unless-stopped

  diagnostics:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: tools/diagnostics/Dockerfile
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
      - ./artifacts:/artifacts

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  lgtm-data:
  diagnostic-ipc:
    driver_opts:
      type: tmpfs
      device: tmpfs
